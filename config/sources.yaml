# ------------------------------------------------------------------------------
# 2. Automated Web / Firecrawl / GitHub Research Sources
# ------------------------------------------------------------------------------
sources:
  # GitHub Repositories & Search Queries (Tier 1)
  - id: gh-agentic-repos
    name: GitHub Trending Agentic Repos
    source_type: github
    source_tier: 1
    target: "topic:ai-agent OR topic:mcp OR topic:browser-use OR topic:coding-agent"
    polling_frequency_minutes: 360
    enabled: true
    priority: high
    extraction_hints:
      - "Look for release notes, commit logs, and README architecture diagrams."
      - "Focus on new tooling and practical reproduction."

  - id: gh-anthropic-mcp
    name: Model Context Protocol Repositories
    source_type: github
    source_tier: 1
    target: "org:modelcontextprotocol"
    polling_frequency_minutes: 180
    enabled: true
    priority: high
    extraction_hints:
      - "Check for newly registered servers and protocol updates."

  # Web Research & Changelogs via local Scrapling engine (Tier 1 & Tier 2)
  - id: web-simonw-blog
    name: Simon Willison's Weblog
    source_type: scrapling
    source_tier: 1
    target: "https://simonwillison.net/"
    polling_frequency_minutes: 360
    enabled: true
    priority: high
    extraction_hints:
      - "Extract direct code experiments, tool releases, and LLM behavior analysis."

  - id: web-hacker-news-ai
    name: Hacker News High-Signal AI Discussions
    source_type: scrapling
    source_tier: 2
    target: "https://news.ycombinator.com/from?site=github.com"
    polling_frequency_minutes: 180
    enabled: true
    priority: medium
    extraction_hints:
      - "Isolate comments with technical criticisms, benchmark reproductions, and limitations."

  # Social / Community via Agent Reach
  - id: social-agent-builders
    name: Agent Builders & Practitioners Stream
    source_type: agent_reach
    source_tier: 2
    target: "query:('AI agent' OR 'coding agent' OR 'browser use' OR 'MCP') (demo OR experiment OR release)"
    polling_frequency_minutes: 180
    enabled: true
    priority: high
    extraction_hints:
      - "Filter out purely speculative hype; prioritize posts with video demos, github links, or metrics."
